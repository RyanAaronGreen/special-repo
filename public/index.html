<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Files</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        h1 { color: #333; }
        .directory {
            margin: 16px 0;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
        }
        .directory summary {
            padding: 14px 18px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            background: #f7f7f7;
        }
        .directory summary:hover {
            background: #eee;
        }
        .directory ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .directory li {
            padding: 10px 18px;
            border-top: 1px solid #e0e0e0;
        }
        a {
            color: #0070f3;
            text-decoration: none;
        }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h1>Available Files</h1>
    <div id="file-list">Loading...</div>

    <script>
        fetch('/files/files.json')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('file-list');
                container.innerHTML = data.directories
                    .map(dir => `
                        <details class="directory">
                            <summary>${dir.name}</summary>
                            <ul>
                                ${dir.files.map(file =>
                                    `<li><a href="/files/${dir.path}/${file}">${file}</a></li>`
                                ).join('')}
                            </ul>
                        </details>
                    `).join('');
            });
    </script>
</body>
</html>
